name: Update episodes

on:
  schedule:
    # New episodes are published on Thursday mornings; run shortly after.
    # Times are UTC. GitHub delays (or occasionally drops) scheduled runs,
    # especially on :00/:30, so use an off-peak minute plus a later fallback.
    # A second run is a no-op when the first already picked everything up.
    - cron: "30 7 * * 4"
    - cron: "30 11 * * 4"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max episodes to transcribe in this run"
        required: false
        default: "3"

# Never run two updates at the same time; they would both push.
concurrency:
  group: update-episodes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAX_NEW_TRANSCRIPTIONS: ${{ inputs.max_new || '3' }}
      WHISPER_MODEL: medium

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install local Whisper (only when no OpenAI key is configured)
        if: env.OPENAI_API_KEY == ''
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-whisper.txt

      - name: Cache Whisper model
        if: env.OPENAI_API_KEY == ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Fetch feed and transcribe new episodes
        run: python scripts/fetch_data.py

      - name: Clean transcriptions
        run: python scripts/clean_transcriptions.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update episodes ($(date -u +%Y-%m-%d))"
          git push
