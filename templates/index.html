<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echt Gebeurd Archief</title>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- MiniSearch -->
    <script src="https://cdn.jsdelivr.net/npm/minisearch@6.1.0/dist/umd/index.min.js"></script>

    <style>
        /* Modern Reset & Base Styles */
        :root {
            --primary: #2563eb;
            --text: #1f2937;
            --bg: #f3f4f6;
            --white: #ffffff;
            --border: #e5e7eb;
            --hover: #f9fafb;
            --selected: #eff6ff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        header {
            background-color: #111827;
            color: var(--white);
            padding: 1rem 2rem;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; font-size: 1.5rem; }
        header p { margin: 0; opacity: 0.8; font-size: 0.9rem; }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Sidebar (List) */
        .sidebar {
            width: 400px;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .search-box {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--white);
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        .search-box input:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .episode-list {
            overflow-y: auto;
            flex: 1;
        }

        .episode-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .episode-item:hover {
            background-color: var(--hover);
        }

        .episode-item.active {
            background-color: var(--selected);
            border-left: 4px solid var(--primary);
            padding-left: calc(1rem - 4px);
        }

        .episode-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            display: block;
        }

        .episode-meta {
            font-size: 0.85rem;
            color: #6b7280;
        }

        /* Detail View */
        .detail-view {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            background: var(--white);
            position: relative;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            font-size: 1.2rem;
            text-align: center;
        }

        .content-width {
            max-width: 800px;
            margin: 0 auto;
        }

        .detail-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .detail-title {
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
            color: #111827;
        }

        .detail-meta {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            background-color: #e5e7eb;
            color: #374151;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }

        .audio-player {
            width: 100%;
            margin: 1.5rem 0;
        }

        .transcription-box {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            white-space: pre-wrap;
            line-height: 1.7;
            font-family: Georgia, serif;
            color: #374151;
            margin-top: 2rem;
        }

        .description {
            line-height: 1.6;
            color: #4b5563;
        }
        
        .description a { color: var(--primary); text-decoration: none; }
        .description a:hover { text-decoration: underline; }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
            .detail-view { height: 60vh; }
        }
    </style>
</head>
<body>

    <div x-data="app()" x-init="initApp()" style="height: 100%; display: flex; flex-direction: column;">
        
        <header>
            <div>
                <h1>Echt Gebeurd Archief</h1>
                <p>Doorzoekbare transcripties en audio</p>
            </div>
            <div x-show="isLoadingIndex" style="display: flex; align-items: center; font-size: 0.8rem;">
                Index laden... <div class="loading-spinner"></div>
            </div>
        </header>

        <div class="main-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="search-box">
                    <input 
                        type="text" 
                        x-model="searchQuery" 
                        @input.debounce.300ms="performSearch()" 
                        @focus="loadSearchIndex()"
                        placeholder="Zoek in titels, tekst & keywords..."
                    >
                    <div style="font-size: 0.8rem; color: #6b7280; margin-top: 0.5rem; display: flex; justify-content: space-between;">
                        <span x-text="filteredEpisodes.length + ' afleveringen'"></span>
                        <span x-show="searchQuery.length > 0 && !miniSearch" style="color: orange;">(Alleen titels doorzoeken...)</span>
                    </div>
                </div>
                
                <div class="episode-list">
                    <template x-for="ep in filteredEpisodes" :key="ep.guid">
                        <div 
                            class="episode-item" 
                            :class="{ 'active': selectedEpisode && selectedEpisode.guid === ep.guid }"
                            @click="selectEpisode(ep)"
                        >
                            <span class="episode-title" x-text="ep.title"></span>
                            <div class="episode-meta">
                                <span x-text="formatDate(ep.published)"></span>
                            </div>
                        </div>
                    </template>
                    
                    <div x-show="filteredEpisodes.length === 0" style="padding: 2rem; text-align: center; color: #9ca3af;">
                        Geen resultaten gevonden.
                    </div>
                </div>
            </div>

            <!-- Detail View -->
            <div class="detail-view">
                <template x-if="!selectedEpisode">
                    <div class="empty-state">
                        <div>
                            <p>Selecteer een aflevering om te beginnen.</p>
                        </div>
                    </div>
                </template>

                <template x-if="selectedEpisode">
                    <div class="content-width">
                        <div class="detail-header">
                            <h2 class="detail-title" x-text="selectedEpisode.title"></h2>
                            <div class="detail-meta">
                                Gepubliceerd op <span x-text="formatDate(selectedEpisode.published)"></span>
                            </div>
                            
                            <!-- Keywords -->
                            <div>
                                <template x-for="kw in selectedEpisode.keywords" :key="kw">
                                    <span class="tag" x-text="'#' + kw"></span>
                                </template>
                            </div>
                        </div>

                        <!-- Image -->
                        <template x-if="selectedEpisode.image_file">
                            <img :src="selectedEpisode.image_file" style="max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 1.5rem;" alt="Aflevering afbeelding">
                        </template>

                        <!-- Audio -->
                        <audio class="audio-player" controls :src="selectedEpisode.audio_file" x-ref="audioPlayer"></audio>

                        <!-- Description -->
                        <div class="description" x-html="selectedEpisode.description"></div>

                        <div style="margin-top: 1rem;">
                            <a :href="selectedEpisode.original_link" target="_blank" style="color: var(--primary);">Bekijk origineel</a>
                        </div>

                        <!-- Transcription -->
                        <div style="margin-top: 3rem;">
                            <h3 style="border-bottom: 2px solid #eee; padding-bottom: 0.5rem;">Transcriptie</h3>
                            
                            <div x-show="isLoadingTranscript" style="padding: 2rem; text-align: center; color: #6b7280;">
                                Transcriptie laden... <div class="loading-spinner"></div>
                            </div>

                            <div x-show="!isLoadingTranscript && transcriptionText" class="transcription-box" x-text="transcriptionText"></div>
                            
                            <div x-show="!isLoadingTranscript && !transcriptionText" style="padding: 1rem; color: #9ca3af; font-style: italic;">
                                Geen transcriptie beschikbaar.
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </div>

    <script>
        function app() {
            return {
                allEpisodes: [],
                filteredEpisodes: [],
                selectedEpisode: null,
                searchQuery: '',
                transcriptionText: '',
                
                // State flags
                isLoadingIndex: false,
                isIndexLoaded: false,
                isLoadingTranscript: false,
                
                // Search Engine
                miniSearch: null,

                async initApp() {
                    // 1. Fetch lightweight metadata
                    try {
                        const res = await fetch('data/episodes.json');
                        this.allEpisodes = await res.json();
                        this.filteredEpisodes = this.allEpisodes;
                    } catch (e) {
                        console.error("Failed to load episodes", e);
                    }
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    // Simple parse, assume standard format or just return part of it
                    // "Thu, 11 Dec 2025 05:30:00 +0000" -> "11 Dec 2025"
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
                },

                async loadSearchIndex() {
                    if (this.isIndexLoaded || this.isLoadingIndex) return;
                    
                    this.isLoadingIndex = true;
                    try {
                        const res = await fetch('data/search_index.json');
                        const docs = await res.json();
                        
                        // Initialize MiniSearch
                        this.miniSearch = new MiniSearch({
                            fields: ['title', 'txt', 'keywords', 'desc'], // fields to index for full-text search
                            storeFields: ['id'], // fields to return with search results
                            searchOptions: {
                                boost: { title: 2, keywords: 1.5 },
                                fuzzy: false,
                                prefix: true
                            }
                        });
                        
                        this.miniSearch.addAll(docs);
                        this.isIndexLoaded = true;
                        console.log("Search index loaded.");
                        
                        // Re-run search if query exists
                        if (this.searchQuery) {
                            this.performSearch();
                        }
                    } catch (e) {
                        console.error("Failed to load search index", e);
                    } finally {
                        this.isLoadingIndex = false;
                    }
                },

                performSearch() {
                    if (!this.searchQuery.trim()) {
                        this.filteredEpisodes = this.allEpisodes;
                        return;
                    }

                    if (this.miniSearch && this.isIndexLoaded) {
                        // Use MiniSearch
                        const results = this.miniSearch.search(this.searchQuery);
                        const ids = new Set(results.map(r => r.id));
                        this.filteredEpisodes = this.allEpisodes.filter(ep => ids.has(ep.guid));
                    } else {
                        // Fallback: Simple Title/Keyword filter
                        const q = this.searchQuery.toLowerCase();
                        this.filteredEpisodes = this.allEpisodes.filter(ep => {
                            return (ep.title && ep.title.toLowerCase().includes(q)) ||
                                   (ep.keywords && ep.keywords.some(k => k.toLowerCase().includes(q)));
                        });
                    }
                },

                async selectEpisode(ep) {
                    this.selectedEpisode = ep;
                    this.transcriptionText = ''; // clear previous
                    
                    // Stop audio if playing (optional, handled by browser usually but good UX)
                    const player = this.$refs.audioPlayer;
                    if (player) { player.pause(); player.currentTime = 0; }

                    if (ep.transcription_file) {
                        this.isLoadingTranscript = true;
                        try {
                            const res = await fetch(ep.transcription_file);
                            if (res.ok) {
                                const buffer = await res.arrayBuffer();
                                const decoder = new TextDecoder("windows-1252");
                                this.transcriptionText = decoder.decode(buffer);
                            } else {
                                this.transcriptionText = "Kon transcriptie niet laden.";
                            }
                        } catch (e) {
                            this.transcriptionText = "Fout bij laden transcriptie.";
                        } finally {
                            this.isLoadingTranscript = false;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
